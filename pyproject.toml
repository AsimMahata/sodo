[project]
name = "sodo"
version = "0.1.0"
description = "YouTube → MP3 downloader CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "asim" }]

dependencies = [
    "yt-dlp>=2024.1.0",
    "click>=8.1",
]

[project.scripts]
sodo = "sodo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sodo*"]
