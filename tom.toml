name = "sodo"
description = "YouTube → MP3 & MP4 downloader CLI"
version = "0.2.0"
author = "Asim Mahata"
tags = ["youtube", "mp3", "mp4", "downloader", "playlist", "media", "cli"]
requirements = [
    "Python 3.10+",
    "pip in PATH",
    "ffmpeg (optional for audio conversion)"
]
install_steps = [
    "pip install --no-deps -e ."
]
uninstall_steps = [
    "pip uninstall -y sodo"
]
tips = [
    "Run 'sodo --help' to see YouTube download and conversion commands",
    "Supports downloading playlists and custom bitrates"
]
